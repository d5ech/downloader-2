version: "3.9"

# ---------------------------------------------------------------------------
# Shared environment — backend services inherit this anchor
# ---------------------------------------------------------------------------
x-backend-env: &backend-env
  REDIS_URL: redis://redis:6379/0
  DOWNLOAD_ROOT: /app/media/downloads
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  # Add any secrets via .env (never commit actual values)
  # FB_ACCESS_TOKEN: ${FB_ACCESS_TOKEN}

services:

  # --------------------------------------------------------------------------
  # Redis — job queue and result backend
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------------------------
  # FastAPI — REST API
  # --------------------------------------------------------------------------
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      <<: *backend-env
    volumes:
      - media_downloads:/app/media/downloads
      # Live-reload in development: mount source directories
      - ../backend:/app/backend
      - ../workers:/app/workers
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------------------------
  # RQ Worker — background job processor
  # --------------------------------------------------------------------------
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: worker
    restart: unless-stopped
    environment:
      <<: *backend-env
      RQ_QUEUES: default
      RQ_BURST: "false"
    volumes:
      - media_downloads:/app/media/downloads
      - ../backend:/app/backend
      - ../workers:/app/workers
    depends_on:
      redis:
        condition: service_healthy
    # Scale workers: docker compose up --scale worker=3
    deploy:
      replicas: 1

  # --------------------------------------------------------------------------
  # RQ Dashboard — optional monitoring UI (dev only)
  # --------------------------------------------------------------------------
  rq-dashboard:
    image: eoranged/rq-dashboard:latest
    restart: unless-stopped
    ports:
      - "9181:9181"
    environment:
      RQ_DASHBOARD_REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
    profiles:
      - dev  # Only started with: docker compose --profile dev up

  # --------------------------------------------------------------------------
  # Next.js Frontend
  # --------------------------------------------------------------------------
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://api:8000
    depends_on:
      - api

volumes:
  redis_data:
  media_downloads:
